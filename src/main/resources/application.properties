spring.application.name=AIgame
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,info
logging.level.root=INFO
logging.file.name=${AI_GAME_LOG_FILE:./logs/aigame.log}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} [requestId=%X{requestId:-}] - %msg %kvp%n%wEx
aigame.logging.export-enabled=${AI_GAME_LOG_EXPORT_ENABLED:true}
aigame.persistence.root=${AI_GAME_SAVE_ROOT:./data/saves}
