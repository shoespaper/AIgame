spring.application.name=AIgame
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,info
logging.level.root=INFO
aigame.persistence.root=${AI_GAME_SAVE_ROOT:./data/saves}
aigame.narrative.enabled=${AI_GAME_NARRATIVE_ENABLED:false}
aigame.narrative.api-key=${AI_GAME_NARRATIVE_API_KEY:}
aigame.narrative.base-url=${AI_GAME_NARRATIVE_BASE_URL:https://api.openai.com/v1}
aigame.narrative.model=${AI_GAME_NARRATIVE_MODEL:gpt-4o-mini}
